# Serverda ishlash uchun (Render, Railway va h.k.). Barcha qiymatlar muhit o'zgaruvchilaridan olinadi.
server.port=${PORT:8080}

# Neon PostgreSQL: DATABASE_URL = jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.h2.console.enabled=false
spring.thymeleaf.cache=true
app.demo-data=${DEMO_DATA:false}
app.remember-me-key=${REMEMBER_ME_KEY:change-me}
