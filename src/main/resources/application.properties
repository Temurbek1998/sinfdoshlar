spring.application.name=sinfdoshlar
server.port=8080

# --- Ma'lumotlar bazasi: H2 (fayl), o'rnatish shart emas ---
spring.datasource.url=jdbc:h2:file:./data/sinfdoshlar;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Baza bo'sh bo'lsa demo foydalanuvchilar yaratiladi (ali, dilnoza, jasur, malika / parol 123456)
app.demo-data=true
