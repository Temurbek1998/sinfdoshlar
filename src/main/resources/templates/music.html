<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Musiqa')}"></head>
<body class="has-player">
<header th:replace="~{fragments/layout :: header}"></header>
<div class="page two">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main-col">
        <section class="card music-head">
            <nav class="pill-tabs">
                <a th:href="@{/music}" th:classappend="${tab == 'popular'} ? 'active'"><svg class="i i-sm"><use href="/img/icons.svg#music"/></svg> Barcha qo'shiqlar</a>
                <a th:href="@{/music(tab='mine')}" th:classappend="${tab == 'mine'} ? 'active'"><svg class="i i-sm"><use href="/img/icons.svg#heart"/></svg> Mening musiqam</a>
            </nav>
            <form th:action="@{/music}" method="get" class="search-big compact">
                <svg class="i"><use href="/img/icons.svg#search"/></svg>
                <input type="search" name="q" th:value="${mq}" placeholder="Qo'shiq yoki ijrochi">
            </form>
        </section>

        <details class="card upload-details">
            <summary><svg class="i"><use href="/img/icons.svg#upload"/></svg> Qo'shiq yuklash <span class="muted small">MP3, 10 MB gacha</span></summary>
            <form class="upload-row" th:action="@{/music}" method="post" enctype="multipart/form-data">
                <input class="field" type="file" name="file" accept=".mp3,audio/mpeg" required data-max-mb="10">
                <input class="field" type="text" name="title" maxlength="200" placeholder="Qo'shiq nomi (bo'sh qolsa fayl nomi)">
                <input class="field" type="text" name="artist" maxlength="200" placeholder="Ijrochi">
                <button class="btn primary">Yuklash</button>
            </form>
        </details>

        <section class="card">
            <h2 class="card-title" th:text="${tab == 'mine'} ? 'Mening musiqam' : (${mq != null and !#strings.isEmpty(mq)} ? 'Qidiruv natijalari' : 'Yangi qo\'shiqlar')">Qo'shiqlar</h2>
            <div th:if="${tracks.isEmpty()}" class="empty">
                <svg class="i i-xl"><use href="/img/icons.svg#music"/></svg>
                <p class="muted" th:text="${tab == 'mine'} ? 'Ro\'yxatingiz bo\'sh. Qo\'shiq yuklang yoki boshqalarnikini qo\'shing.' : 'Hali qo\'shiqlar yo\'q. Birinchi bo\'lib yuklang!'">Bo'sh</p>
            </div>
            <ol class="track-list">
                <li class="track" th:each="t, st : ${tracks}" th:attr="data-src=${t.url},data-title=${t.title},data-artist=${t.artist ?: ''}">
                    <button class="track-play" type="button" title="Ijro etish">
                        <svg class="i i-sm play"><use href="/img/icons.svg#play"/></svg>
                        <svg class="i i-sm pause"><use href="/img/icons.svg#pause"/></svg>
                    </button>
                    <div class="track-info">
                        <div class="track-title" th:text="${t.title}">Nomi</div>
                        <div class="muted small" th:text="${t.artist ?: 'Noma''lum ijrochi'}">Ijrochi</div>
                    </div>
                    <span class="muted small track-owner">
                        <a th:href="@{/profile/{u}(u=${t.owner.username})}" th:text="${t.owner.fullName}">Ism</a></span>
                    <span class="muted small track-time" data-duration>--:--</span>
                    <form th:action="@{/music/{id}/save(id=${t.id})}" method="post">
                        <button class="icon-btn" th:classappend="${savedIds.contains(t.id)} ? 'accent'"
                                th:title="${savedIds.contains(t.id)} ? 'Ro\'yxatdan olib tashlash' : 'Mening musiqamga qo\'shish'">
                            <svg class="i i-sm" th:if="${savedIds.contains(t.id)}"><use href="/img/icons.svg#check"/></svg>
                            <svg class="i i-sm" th:unless="${savedIds.contains(t.id)}"><use href="/img/icons.svg#plus"/></svg>
                        </button>
                    </form>
                </li>
            </ol>
        </section>
    </main>
</div>

<div class="player" id="player" hidden>
    <div class="player-controls">
        <button type="button" class="icon-btn" data-prev title="Oldingi"><svg class="i"><use href="/img/icons.svg#prev"/></svg></button>
        <button type="button" class="player-main" data-toggle title="Ijro / pauza">
            <svg class="i play"><use href="/img/icons.svg#play"/></svg>
            <svg class="i pause"><use href="/img/icons.svg#pause"/></svg>
        </button>
        <button type="button" class="icon-btn" data-next title="Keyingi"><svg class="i"><use href="/img/icons.svg#next"/></svg></button>
    </div>
    <div class="player-info">
        <div class="player-title" data-title>—</div>
        <div class="muted small" data-artist></div>
    </div>
    <div class="player-progress">
        <span class="small muted" data-current>0:00</span>
        <input type="range" min="0" max="100" value="0" step="0.1" data-seek>
        <span class="small muted" data-total>0:00</span>
    </div>
    <div class="player-volume">
        <svg class="i i-sm"><use href="/img/icons.svg#volume"/></svg>
        <input type="range" min="0" max="1" value="0.8" step="0.01" data-volume>
    </div>
    <audio preload="metadata"></audio>
</div>
<nav th:replace="~{fragments/layout :: mobile-nav}"></nav>
</body>
</html>
