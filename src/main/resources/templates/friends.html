<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Do\'stlar')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div class="page two">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main-col">
        <section class="card" th:unless="${incoming.isEmpty()}">
            <h2 class="card-title">Do'stlik so'rovlari <span class="count-pill" th:text="${incoming.size()}">1</span></h2>
            <div class="person-row" th:each="r : ${incoming}">
                <a th:replace="~{fragments/layout :: person-link(${r.requester})}"></a>
                <form th:action="@{/friends/{u}/accept(u=${r.requester.username})}" method="post" class="inline">
                    <button class="btn primary">Qabul qilish</button></form>
                <form th:action="@{/friends/{u}/remove(u=${r.requester.username})}" method="post" class="inline">
                    <button class="btn">Rad etish</button></form>
            </div>
        </section>

        <section class="card">
            <h2 class="card-title">Mening do'stlarim <span class="muted" th:text="${friends.size()}">0</span></h2>
            <div th:if="${friends.isEmpty()}" class="empty">
                <p class="muted">Hali do'stlaringiz yo'q.</p>
                <a class="btn primary" th:href="@{/search}">Odamlarni topish</a>
            </div>
            <div class="friend-cards">
                <div class="friend-card" th:each="f : ${friends}">
                    <a th:href="@{/profile/{u}(u=${f.username})}">
                        <span class="avatar avatar-96" th:style="'background:' + ${f.avatarColor}" th:text="${f.initial}">A</span>
                    </a>
                    <a class="name" th:href="@{/profile/{u}(u=${f.username})}" th:text="${f.fullName}">Ism</a>
                    <span class="muted small" th:text="${f.city ?: ' '}">Shahar</span>
                    <a class="btn btn-sm" th:href="@{/messages/{u}(u=${f.username})}">Xabar yozish</a>
                </div>
            </div>
        </section>

        <section class="card" th:unless="${outgoing.isEmpty()}">
            <h2 class="card-title">Yuborilgan so'rovlar</h2>
            <div class="person-row" th:each="r : ${outgoing}">
                <a th:replace="~{fragments/layout :: person-link(${r.addressee})}"></a>
                <form th:action="@{/friends/{u}/remove(u=${r.addressee.username})}" method="post" class="inline">
                    <button class="btn">Bekor qilish</button></form>
            </div>
        </section>
    </main>
</div>
<nav th:replace="~{fragments/layout :: mobile-nav}"></nav>
</body>
</html>
