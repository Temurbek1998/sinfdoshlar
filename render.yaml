services:
  - type: web
    name: sinfdoshlar
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: REMEMBER_ME_KEY
        generateValue: true
      - key: DEMO_DATA
        value: "true"
